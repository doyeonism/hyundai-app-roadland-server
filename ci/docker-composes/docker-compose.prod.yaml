# 운영 compose.
#
# 이미지는 VM 에서 빌드하지 않고 GitHub Actions 가 GHCR 에 push 한 것을 pull 한다.
#   IMAGE_PREFIX : ghcr.io/<owner>/<repo>   (워크플로우가 .env 에 기록)
#   IMAGE_TAG    : 기본 latest. 롤백 시 특정 커밋 SHA 태그를 지정한다.
#
# 배포 절차(워크플로우가 수행):
#   docker compose pull → docker compose up -d --no-build --wait → image prune
# compose 는 이미지 digest 가 바뀐 서비스만 재생성하므로, 바뀌지 않은 앱과
# db/redis/nginx 는 그대로 유지된다.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"    # winston 의 maxSize 20m / maxFiles 14d 를 그대로 옮긴 값
    max-file: "14"

services:
  db:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME}-db
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${PROJECT_NAME}-db:5432/${POSTGRES_DB}
      - PROJECT_NAME=${PROJECT_NAME}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_PORT=${DB_PORT}
      - APP_NAME=${APP_NAME}
    volumes:
      - ../../ci/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ../../pgdata:/var/lib/postgresql/data
    # 외부에 열지 않고 로컬(SSH 터널)로만 접근한다.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    logging: *default-logging
    networks:
      - custom-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX (ghcr.io/<owner>/<repo>) 가 필요합니다}/api:${IMAGE_TAG:-latest}
    container_name: ${PROJECT_NAME}-server
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${PROJECT_NAME}-db:5432/${POSTGRES_DB}
      - PROJECT_NAME=${PROJECT_NAME}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_PORT=${DB_PORT}
      - NETWORK_NAME=${NETWORK_NAME}
      - SERVER_PORT=${SERVER_PORT:-3000}
      - APP_NAME=${APP_NAME}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - SERVER_NAME=${SERVER_NAME}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - ACCESS_JWT_SECRET=${ACCESS_JWT_SECRET}
      - ACCESS_JWT_EXPIRED_SEC=${ACCESS_JWT_EXPIRED_SEC}
      - REFRESH_JWT_SECRET=${REFRESH_JWT_SECRET}
      - REFRESH_JWT_EXPIRED_SEC=${REFRESH_JWT_EXPIRED_SEC}
      - SIGN_UP_JWT_SECRET=${SIGN_UP_JWT_SECRET}
      - SIGN_UP_JWT_EXPIRED_SEC=${SIGN_UP_JWT_EXPIRED_SEC}
      - API_PUBLIC_URL=${API_PUBLIC_URL}
      - WEB_PUBLIC_URL=${WEB_PUBLIC_URL}
      # 소셜 로그인 (서비스: Google · LINE · WeChat). 비어 있으면 해당 provider 는 501
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-}
      - LINE_CHANNEL_ID=${LINE_CHANNEL_ID:-}
      - LINE_CHANNEL_SECRET=${LINE_CHANNEL_SECRET:-}
      - LINE_CALLBACK_URL=${LINE_CALLBACK_URL:-}
      - WECHAT_APP_ID=${WECHAT_APP_ID:-}
      - WECHAT_APP_SECRET=${WECHAT_APP_SECRET:-}
      - WECHAT_CALLBACK_URL=${WECHAT_CALLBACK_URL:-}
      - SOCIAL_LOGIN_SUCCESS_REDIRECT=${SOCIAL_LOGIN_SUCCESS_REDIRECT:-}
      - SOCIAL_LOGIN_FAILURE_REDIRECT=${SOCIAL_LOGIN_FAILURE_REDIRECT:-}
      - PORT=${SERVER_PORT:-3000}
      - REDIS_HOST=${PROJECT_NAME}-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    # 호스트에도 같은 포트로 연다. 서비스 트래픽은 edge(Caddy) → nginx 로 들어온다.
    ports:
      - "${SERVER_PORT:-3000}:${SERVER_PORT:-3000}"
    logging: *default-logging
    volumes:
      - server-resources:/app/resources
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - custom-network
    # node:alpine 에는 curl 이 없으므로 busybox wget 을 사용한다.
    # start_period 는 기동 시 prisma migrate deploy 가 먼저 실행되는 시간을 감안한 값.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:${SERVER_PORT:-3000}/api/${PROJECT_NAME}/v1/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX (ghcr.io/<owner>/<repo>) 가 필요합니다}/web:${IMAGE_TAG:-latest}
    container_name: ${PROJECT_NAME}-web
    restart: unless-stopped
    environment:
      - PROJECT_NAME=${PROJECT_NAME}
      - NETWORK_NAME=${NETWORK_NAME}
      - WEB_PORT=${WEB_PORT:-3001}
      - APP_NAME=${APP_NAME}
      # 컨테이너 내부 API 주소는 env 에 적지 않고 여기서 조립한다 (server 의 container_name 과 항상 일치).
      - API_BASE_URL=http://${PROJECT_NAME}-server:${SERVER_PORT:-3000}
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
      - NEXT_PUBLIC_PROJECT_NAME=${PROJECT_NAME}
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
      - API_PUBLIC_URL=${API_PUBLIC_URL}
      - PORT=${WEB_PORT:-3001}
    ports:
      - "${WEB_PORT:-3001}:${WEB_PORT:-3001}"
    logging: *default-logging
    networks:
      - custom-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:${WEB_PORT:-3001}/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  admin:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX (ghcr.io/<owner>/<repo>) 가 필요합니다}/admin:${IMAGE_TAG:-latest}
    container_name: ${PROJECT_NAME}-admin
    restart: unless-stopped
    environment:
      - PROJECT_NAME=${PROJECT_NAME}
      - NETWORK_NAME=${NETWORK_NAME}
      - ADMIN_PORT=${ADMIN_PORT:-3333}
      - APP_NAME=${APP_NAME}
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
      - NEXT_PUBLIC_PROJECT_NAME=${PROJECT_NAME}
      # 컨테이너 내부 API 주소는 env 에 적지 않고 여기서 조립한다 (server 의 container_name 과 항상 일치).
      - API_BASE_URL=http://${PROJECT_NAME}-server:${SERVER_PORT:-3000}
      - PORT=${ADMIN_PORT:-3333}
    ports:
      - "${ADMIN_PORT:-3333}:${ADMIN_PORT:-3333}"
    logging: *default-logging
    networks:
      - custom-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:${ADMIN_PORT:-3333}/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 호스트 포트를 열지 않는 내부 리버스 프록시.
  # 외부 트래픽(80/443)과 TLS 는 서버 공용 엣지 프록시(Caddy, ci/edge/)가 담당하며,
  # 엣지가 edge 네트워크를 통해 ${PROJECT_NAME}-nginx:80 으로 전달합니다.
  # 템플릿의 resolver(valid=10s) 덕분에 앱 컨테이너가 교체돼 IP 가 바뀌어도 자동 재조회한다.
  nginx:
    image: nginx:1.25-alpine
    container_name: ${PROJECT_NAME}-nginx
    restart: unless-stopped
    environment:
      - PROJECT_NAME=${PROJECT_NAME}
      - SERVER_PORT=${SERVER_PORT:-3000}
      - WEB_PORT=${WEB_PORT:-3001}
      - ADMIN_PORT=${ADMIN_PORT:-3333}
      - SERVER_NAME=${SERVER_NAME}
      - NGINX_ENVSUBST_FILTER=PROJECT_NAME|SERVER_PORT|WEB_PORT|ADMIN_PORT|SERVER_NAME
    volumes:
      - ../nginx/templates:/etc/nginx/templates:ro
    logging: *default-logging
    depends_on:
      server:
        condition: service_started
      web:
        condition: service_started
      admin:
        condition: service_started
    networks:
      - custom-network
      - edge

  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME}-redis
    restart: unless-stopped
    # 운영 Redis 는 외부 포트를 노출하지 않고 내부 네트워크로만 접근합니다.
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    logging: *default-logging
    volumes:
      - redisdata:/data
    networks:
      - custom-network
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  custom-network:
    driver: bridge
    external: true
    name: ${NETWORK_NAME}
  # 엣지 프록시(Caddy)와 공유하는 네트워크. 서버 셋업 시 `docker network create edge` 필요.
  edge:
    external: true
    name: ${EDGE_NETWORK_NAME:-edge}

volumes:
  redisdata:
  server-resources:
